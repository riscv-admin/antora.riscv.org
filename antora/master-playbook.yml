site:
  title: RISC-V Ratified Specifications Library
  url: https://docs.riscv.org
  keys:
    # google_analytics: 'GTM-NXLCGZF4'

urls:
  latest_version_segment_strategy: redirect:to
  latest_version_segment: ''

output:
  dir: ./build/reference

content:
  sources:
  # AIA
  - url: https://github.com/riscv/riscv-aia.git
    branches: antora-refactor
    start_page: ROOT::index.adoc
    start_path: /
    worktrees: true
    submodules: true

  # IOMMU
  - url: https://github.com/riscv-non-isa/riscv-iommu.git
    branches: antora-refactor
    start_page: ROOT::index.adoc
    start_path: /
    worktrees: true
    submodules: true

  # PLIC
  - url: https://github.com/riscv/riscv-plic-spec.git
    branches: antora-refactor
    start_page: ROOT::index.adoc
    start_path: /

  # Server SoC
  - url: https://github.com/riscv-non-isa/server-soc.git
    branches: antora-refactor
    start_page: ROOT::index.adoc
    start_path: /

  # ISA Manual
  - url: https://github.com/riscv/riscv-isa-manual.git
    branches: [v20250508,v20240411]
    start_page: ROOT::index.adoc
    start_path: /
    worktrees: true
    submodules: true

  # Trace Spec
  - url: https://github.com/riscv-non-isa/riscv-trace-spec.git
    branches: antora-refactor
    start_page: ROOT::index.adoc
    start_path: /

  # CBQRI
  - url: https://github.com/riscv-non-isa/riscv-cbqri.git
    branches: antora-refactor
    start_page: ROOT::index.adoc
    start_path: /

  # RAS ERI
  - url: https://github.com/riscv-non-isa/riscv-ras-eri.git
    branches: antora-refactor
    start_page: ROOT::index.adoc
    start_path: /

  # E-Trace Encap
  - url: https://github.com/riscv-non-isa/e-trace-encap.git
    branches: antora-refactor
    start_page: ROOT::index.adoc
    start_path: /

  # Nexus Trace (3 modules)
  - url: https://github.com/riscv-non-isa/tg-nexus-trace.git
    branches: antora-refactor
    start_path: modules/ntrace

  - url: https://github.com/riscv-non-isa/tg-nexus-trace.git
    branches: antora-refactor
    start_path: modules/connectors

  - url: https://github.com/riscv-non-isa/tg-nexus-trace.git
    branches: antora-refactor
    start_path: modules/tci

  # Semihosting
  - url: https://github.com/riscv-non-isa/riscv-semihosting.git
    branches: antora-refactor
    start_page: ROOT::index.adoc
    start_path: /

  # BRS
  - url: https://github.com/riscv-non-isa/riscv-brs.git
    branches: antora-refactor
    start_page: ROOT::index.adoc
    start_path: /

  # ACPI RIMT
  - url: https://github.com/riscv-non-isa/riscv-acpi-rimt.git
    branches: antora-refactor
    start_page: ROOT::index.adoc
    start_path: /

  # RPMI
  - url: https://github.com/riscv-non-isa/riscv-rpmi.git
    branches: antora-refactor
    start_page: ROOT::index.adoc
    start_path: /

  # SBI
  - url: https://github.com/riscv-non-isa/riscv-sbi-doc.git
    branches: antora-refactor
    start_page: ROOT::index.adoc
    start_path: /

  # UEFI
  - url: https://github.com/riscv-non-isa/riscv-uefi.git
    branches: antora-refactor
    start_page: ROOT::index.adoc
    start_path: /

  # ELF psABI
  - url: https://github.com/riscv-non-isa/riscv-elf-psabi-doc.git
    branches: antora-refactor
    start_page: ROOT::index.adoc
    start_path: /

  # RVV Intrinsics
  - url: https://github.com/riscv-non-isa/rvv-intrinsic-doc.git
    branches: antora-refactor
    start_page: ROOT::index.adoc
    start_path: /

asciidoc:
  extensions:
  - asciidoctor-kroki
  - '@djencks/asciidoctor-mathjax'
  attributes:
    kroki-server-url: http://localhost:9870
    kroki-fetch-diagram: true
    doctype: book
    experimental: ''
    icons: font
    idprefix: ''
    idseparator: '-'
    page-pagination: ''
    le: '&#8804;'
    ge: '&#8805;'
    ne: '&#8800;'
    approx: '&#8776;'
    inf: '&#8734;'
    circ: ○
    bullet: ∙
    times: ×
    csrname: 'envcfg'
    incexample: example$
    incimage: ../images/
    part-signifier: Chapter
    setanchors:
    toclevels: 5
    outlinelevels: 5
    source-highlighter: rouge
    pdf_url: ~
    multiple_pdfs: false
    pdf_list: ~
    fiximages: '../images'
    vertical-ellipsis: '⋮'
    ellipsis: '…'
    check: '✓'
    prime: '′'
    pm: '±'
    rightarrow: '→'
    interpunct: '·'
    i: '_i_'
    u: '_u_'
    ra: '_ra_'
    reg_list: '_reg_list_'

runtime:
  fetch: true

antora:
  extensions:
  - require: '@antora/lunr-extension'
    index_latest_only: true
  - require: './asam-extensions/asam-antora_extension.js'
    bibliography: true
    bibtex-order: "alphabetical"
    bibtex-style: "apa"
    bibtex-format: "asciidoc"
    bibtex-throw: false
  - require: ./riscv-extensions/antora_copy_files_extension.js
    target_sources:
    - url: 'https://github.com/riscv/riscv-isa-manual.git'
      branches: [v20250508,v20240411]
    source_dirs:
      - source: 'src/images'
        target: 'partials'
      - source: 'src'
        target: 'partials'
        extensions: ['.adoc']
      - source: 'src/example'
        target: 'examples'
        extensions: ['.s']
      - source: 'docs-resources/images'
        target: 'partials'
  - require: ./riscv-extensions/antora_include_rewriter.js
    target_sources:
      - url: 'https://github.com/riscv/riscv-isa-manual.git'
        branches: [v20250508,v20240411]
  - require: ./riscv-extensions/nav_numbering_extension.js
    numbering_rules:
      # priv module - v20240411 branch
      - module: priv
        branches: ['v20240411']
        chapters: {start: 5, end: 25}
        appendices: {start: 26, end: 28}

      # priv module - v20250508 branch
      - module: priv
        branches: ['v20250508']
        chapters: {start: 5, end: 24}
        appendices: {start: 25, end: 27}

      # priv module - main branch
      - module: priv
        branches: ['main']
        chapters: {start: 5, end: 24}
        appendices: {start: 25, end: 27}

      # unpriv module - v20240411 branch
      - module: unpriv
        branches: ['v20240411']
        chapters: {start: 5, end: 41}
        appendices: {start: 43, end: 46}

      # unpriv module - v20250508 branch
      - module: unpriv
        branches: ['v20250508']
        chapters: {start: 5, end: 41}
        appendices: {start: 42, end: 46}

      # unpriv module - main branch
      - module: unpriv
        branches: ['main']
        chapters: {start: 3, end: 18}
        appendices: {start: 19, end: 20}

      # AIA module - antora-refactor branch
      - component: aia
        module: ROOT
        branches: ['antora-refactor']
        chapters: {start: 6, end: 13}

      # IOMMU module - antora-refactor branch
      - component: iommu
        module: ROOT
        branches: ['antora-refactor']
        chapters: { start: 6, end: 14}

      # Server SOC - antora-refactor branch
      - component: soc
        module: ROOT
        branches: ['antora-refactor']
        chapters: {start: 5, end: 6}

      # Efficient Trace - antora-refactor-branch
      - component: techtrace
        module: ROOT
        branches: ['antora-refactor']
        chapters: {start: 5, end: 18}

      # Capacity & Bandwidth QoS
      - component: qos
        module: ROOT
        branches: ['antora-refactor']
        chapters: {start: 3, end: 9}

      # RERI
      - component: reri
        module: ROOT
        branches: ['antora-refactor']
        chapters: {start: 4, end: 5}

      # E-Trace encap
      - component: etrace
        module: ROOT
        branches: ['antora-refactor']
        chapters: {start: 4, end: 7}

      # Semi-hosting
      - component: semihost
        module: ROOT
        branches: ['antora-refactor']
        chapters: {start: 5, end: 6}

      # BRS
      - component: brs
        module: ROOT
        branches: ['antora-refactor']
        chapters: {start: 5, end: 11}

      # RIMT
      - component: rimt
        module: ROOT
        branches: ['antora-refactor']
        chapters: {start: 7, end: 10}

      # RPMI
      - component: rpmi
        module: ROOT
        branches: ['antora-refactor']
        chapters: {start: 6, end: 23}

      # SBI
      - component: sbi
        module: ROOT
        branches: ['antora-refactor']
        chapters: {start: 5, end: 27}

      # UEFI
      - component: uefi
        module: ROOT
        branches: ['antora-refactor']
        chapters: {start: 3, end: 5}

      # psABI
      - component: abi
        module: ROOT
        branches: ['antora-refactor']
        chapters: {start: 3, end: 8}

      # Intrinsics
      - component: intrinsic
        module: ROOT
        changes: ['antora-refactor']
        chapters: {start: 5, end: 7}
        appendices: {start: 8, end: 47}

      # Plic
      - component: plic
        module: ROOT
        branches: ['antora-refactor']
        chapters: {start: 6, end: 13}

      # N-Trace
      - component: ntrace
        module: ROOT
        branches: ['antora-refactor']
        chapters: {start: 6, end: 18}

      # Connectors
      - component: connectors
        module: ROOT
        branches: ['antora-refactor']
        chapters: {start: 6, end: 10}

      # TCI
      - component: tci
        module: ROOT
        branches: ['antora-refactor']
        chapters: {start: 6, end: 16}

      # Rule without branch/tag filter - applies to all branches/tags
      - module: ROOT
        branches: ['antora-refactor']
        chapters: {start: 1, end: 100}

  # Add section numbering (uses same config as nav-numbering)
  - require: ./riscv-extensions/section_numbering_extension.js
    numbering_rules:
      # priv module - v20240411 branch
