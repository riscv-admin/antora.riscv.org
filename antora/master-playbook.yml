ui:
  bundle:
    url: https://github.com/riscv-admin/riscv-antora-only-ui-dev/releases/download/latest/ui-bundle.zip
    snapshot: true
  supplemental_files:
  - path: ui.yml
    contents: |
      static_files:
      - .nojekyll
      - index.html
      - ../index.html
  - path: .nojekyll
  - path: index.html
    contents: |
      <!DOCTYPE HTML>
      <html lang="en-US">
          <head>
              <meta charset="UTF-8">
              <meta http-equiv="refresh" content="0; url=isa/">
              <title>Page Redirection</title>
          </head>
          <body>
          </body>
      </html>
  - path: ../index.html
    contents: |
      <!DOCTYPE HTML>
      <html lang="en-US">
          <head>
              <meta charset="UTF-8">
              <meta http-equiv="refresh" content="0; url=reference/isa/">
              <title>Page Redirection</title>
          </head>
          <body>
          </body>
      </html>
