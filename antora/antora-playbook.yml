  # RERI — component: reri | chapters 5–7
  - url: https://github.com/riscv-non-isa/riscv-ras-eri.git
    branches: v1.0-antora
    start_page: ROOT::index.adoc
    start_path: /

  # Debug — component: debug | chapters 3–8
  - url: https://github.com/riscv/riscv-debug-spec.git
    branches: v1.0-antora
    start_page: ROOT::index.adoc
    start_path: /

  # E-Trace Encap — component: etrace | chapters 4–7
  - url: https://github.com/riscv-non-isa/e-trace-encap.git
    branches: v1.0-antora
    start_page: ROOT::index.adoc
    start_path: /

  # N-Trace — component: ntrace | chapters 6–18
  - url: https://github.com/riscv-non-isa/tg-nexus-trace.git
    branches: v1.0-antora
