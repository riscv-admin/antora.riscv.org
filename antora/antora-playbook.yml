asciidoc:
  extensions:
  - asciidoctor-kroki
  - '@djencks/asciidoctor-mathjax'
  #- require: ./riscv-extensions/include-rewriter.js
  attributes:
    #Use this for local generation
    #kroki-server-url: http://localhost:8000
    #Thefollowing is required for GitHuib actions to work.
    kroki-server-url: http://localhost:9870
    kroki-fetch-diagram: true
    doctype: book
    experimental: ''
    icons: font
    idprefix: ''
    idseparator: '-'
    page-pagination: ''
    le: '&#8804;'
    ge: '&#8805;'
    ne: '&#8800;'
    approx: '&#8776;'
    inf: '&#8734;'
    circ: ○
    bullet: ∙
    times: ×
    csrname: 'envcfg'
    incexample: example$
    incimage: ../images/
    part-signifier: Chapter
    #sectnums: all
    #sectnumlevels: 5
    setanchors:
    #partnums: all
    #toc: ''
    toclevels: 5
    outlinelevels: 5
    source-highlighter: rouge
    pdf_url: ~
    multiple_pdfs: false
    pdf_list: ~
    fiximages: '../images'
    # Math and special characters
    vertical-ellipsis: '⋮'
    ellipsis: '…'
    check: '✓'
    prime: '′'
    pm: '±'
    rightarrow: '→'
    interpunct: '·'
    # Variables
    i: '_i_'
    u: '_u_'
    ra: '_ra_'
    reg_list: '_reg_list_'

# Temp disable for local build speedup. Re-enable for deployment.
runtime:
  fetch: true

antora:
  extensions:
  - require: '@antora/lunr-extension'
    index_latest_only: true
  - require: './asam-extensions/asam-antora_extension.js'
    bibliography: true
    bibtex-order: "alphabetical"
    bibtex-style: "apa"
    bibtex-format: "asciidoc"
    bibtex-throw: false
  - require: ./riscv-extensions/antora_copy_files_extension.js
    target_sources:
    - url: 'https://github.com/riscv/riscv-isa-manual.git'
      branches: [v20260120,v20250508,v20240411]
      #branches: ['main', '20250508', '20240411']
    source_dirs:
      # Copy all files from src/images/ to partials/
      - source: 'src/images'
        target: 'partials'
      # Copy only .adoc files from src/ to partials/
      - source: 'src'
        target: 'partials'
        extensions: ['.adoc']
      - source: 'src/example'
        target: 'examples'
        extensions: ['.s']
      - source: 'docs-resources/images'  # Add this for submodule images
        target: 'partials'
  - require: ./riscv-extensions/antora_include_rewriter.js
    target_sources:
      - url: 'https://github.com/riscv/riscv-isa-manual.git'
        #branches: ['main', '20250508', '20240411']
        branches: [v20260120,v20250508,v20240411]
#    numbered_titles: true
#    section_number_style: "iso"
#  - '@antora/pdf-extension'
#     - '@antora/asciidoctor-bibtex'

  - require: ./riscv-extensions/nav_numbering_extension.js
    numbering_rules:  # Make sure this is at the same level as 'require'
        # priv module - v20240411 branch
        - module: priv
          branches: ['v20240411']
          chapters:
            start: 5
            end: 25
          appendices:
            start: 26
            end: 28

        # priv module - v20250508 branch
        - module: priv
          branches: ['v20250508']
          chapters:
            start: 5
            end: 24
          appendices:
            start: 25
            end: 27

        - module: priv
          branches: ['v20260120']
          chapters: {start: 5, end: 24}
          appendices: {start: 25, end: 25}

        # priv module - main branch
        - module: priv
          branches: ['main']
          chapters:
            start: 5
            end: 24
          appendices:
            start: 25
            end: 27

        # unpriv module - v20240411 branch
        - module: unpriv
          branches: ['v20240411']
          chapters:
            start: 5
            end: 41
          appendices:
            start: 43
            end: 46

        # unpriv module - v20250508 branch
        - module: unpriv
          branches: ['v20250508']
          chapters:
            start: 5
            end: 41
          appendices:
            start: 42
            end: 46

        - module: unpriv
          branches: ['v20260120']
          chapters: {start: 5, end: 40}
          appendices: {start: 41, end: 44}

        # unpriv module - main branch
        - module: unpriv
          branches: ['main']
          chapters:
            start: 3
            end: 18
          appendices:
            start: 19
            end: 20

        # Rule without branch/tag filter - applies to all branches/tags
        - module: ROOT
          chapters:
            start: 1
            end: 10

  # Add section numbering (uses same config as nav-numbering)
  - require: ./riscv-extensions/section_numbering_extension.js
    numbering_rules:  # Make sure this is at the same level as 'require'
        # priv module - v20240411 branch
        - module: priv
          branches: ['v20240411']
          chapters:
            start: 5
            end: 25
          appendices:
            start: 26
            end: 28

        # priv module - v20250508 branch
        - module: priv
          branches: ['v20250508']
          chapters:
            start: 5
            end: 24
          appendices:
            start: 25
            end: 27

        - module: priv
          branches: ['v20260120']
          chapters: {start: 5, end: 24}
          appendices: {start: 25, end: 26}

        # priv module - main branch
        - module: priv
          branches: ['main']
          chapters:
            start: 5
            end: 24
          appendices:
            start: 25
            end: 27

        # unpriv module - v20240411 branch
        - module: unpriv
          branches: ['v20240411']
          chapters:
            start: 5
            end: 41
          appendices:
            start: 43
            end: 46

        # unpriv module - v20250508 branch
        - module: unpriv
          branches: ['v20250508']
          chapters:
            start: 5
            end: 41
          appendices:
            start: 42
            end: 46

        - module: unpriv
          branches: ['v20260120']
          chapters: {start: 5, end: 40}
          appendices: {start: 41, end: 44}

        # unpriv module - main branch
        - module: unpriv
          branches: ['main']
          chapters:
            start: 3
            end: 18
          appendices:
            start: 19
            end: 20

        # Rule without branch/tag filter - applies to all branches/tags
        - module: ROOT
          chapters:
            start: 1
            end: 10

