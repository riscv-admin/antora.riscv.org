# =============================================================================
# ASCIIDOC
# =============================================================================
asciidoc:
  extensions:
  - asciidoctor-kroki
  - '@djencks/asciidoctor-mathjax'
  #- require: ./riscv-extensions/include-rewriter.js
  attributes:
    #Use this for local generation
    #kroki-server-url: http://localhost:8000
    # The following is required for GitHub Actions to work.
    kroki-server-url: http://localhost:9870
    kroki-fetch-diagram: true
    kroki-cache-path: ./.cache/kroki
    doctype: book
    experimental: ''
    icons: font
    idprefix: ''
    idseparator: '-'
    page-pagination: ''
    # Use Table and Figure short names
    xrefstyle: short
    # Math and comparison operators
    le: '&#8804;'
    ge: '&#8805;'
    ne: '&#8800;'
    approx: '&#8776;'
    inf: '&#8734;'
    circ: ○
    bullet: ∙
    times: ×
    # Document settings
    csrname: 'envcfg'
    incexample: example$
    incimage: ../images/
    part-signifier: Chapter
    #sectnums: all
    #sectnumlevels: 5
    setanchors:
    #partnums: all
    #toc: ''
    toclevels: 5
    outlinelevels: 5
    source-highlighter: highlight.js
    pdf_url: ~
    multiple_pdfs: false
    pdf_list: ~
    fiximages: '../images'
    # Math and special characters
    vertical-ellipsis: '⋮'
    ellipsis: '…'
    check: '✓'
    prime: '′'
    pm: '±'
    rightarrow: '→'
    interpunct: '·'
    # Inline variable shortcuts
    i: '_i_'
    u: '_u_'
    ra: '_ra_'
    reg_list: '_reg_list_'

# =============================================================================
# RUNTIME
# =============================================================================
# Temp disable for local build speedup. Re-enable for deployment.
runtime:
  fetch: true

# =============================================================================
# ANTORA EXTENSIONS
# =============================================================================
antora:
  extensions:
  - require: '@antora/lunr-extension'
    index_latest_only: true

  - require: './asam-extensions/asam-antora_extension.js'
    bibliography: true
    bibtex-order: "alphabetical"
    bibtex-style: "apa"
    bibtex-format: "asciidoc"
    bibtex-throw: false

  - require: ./riscv-extensions/homepage_cards_generator.js

  - require: ./riscv-extensions/development_specs_cards_generator.js

  - require: ./riscv-extensions/latest_version_root_redirect_extension.js

  - require: ./riscv-extensions/formal_object_numbering_extension.js

  - require: ./riscv-extensions/antora_copy_files_extension.js
    target_sources:
    - url: 'https://github.com/riscv/riscv-isa-manual.git'
      branches: [v20260120, v20250508, v20240411]
      #branches: ['main', '20250508', '20240411']
    source_dirs:
      - source: 'src/images'         # Copy all files from src/images/ to partials/
        target: 'partials'
      - source: 'src'                # Copy only .adoc files from src/ to partials/
        target: 'partials'
        extensions: ['.adoc']
      - source: 'src/example'
        target: 'examples'
        extensions: ['.s']
      - source: 'docs-resources/images'   # Submodule images
        target: 'partials'

  - require: ./riscv-extensions/antora_include_rewriter.js
    target_sources:
      - url: 'https://github.com/riscv/riscv-isa-manual.git'
        #branches: ['main', '20250508', '20240411']
        branches: [v20260120, v20250508, v20240411]
#    numbered_titles: true
#    section_number_style: "iso"
#  - '@antora/pdf-extension'
#  - '@antora/asciidoctor-bibtex'

  # ---------------------------------------------------------------------------
  # NUMBERING RULES
  # Shared by nav_numbering_extension and section_numbering_extension via the
  # YAML anchor &numbering_rules / *numbering_rules.
  #
  # ⚠ NOTE: the intrinsic entry in the original nav_numbering block used
  #   `changes:` instead of `branches:` — this has been corrected to `branches:`
  #   to match the section_numbering block and all other entries.
  # ---------------------------------------------------------------------------

  - require: ./riscv-extensions/nav_numbering_extension.js
    numbering_rules: &numbering_rules

      # --- ISA Manual: priv module -------------------------------------------
      - module: priv
        branches: ['v20240411']
        chapters: {start: 5, end: 25}
        appendices: {start: 26, end: 28}

      - module: priv
        branches: ['v20250508']
        chapters: {start: 5, end: 24}
        appendices: {start: 25, end: 27}

      - module: priv
        branches: ['v20260120']
        chapters: {start: 5, end: 24}
        appendices: {start: 25, end: 25}

      - module: priv
        branches: ['main']
        chapters: {start: 5, end: 24}
        appendices: {start: 25, end: 27}

      # --- ISA Manual: unpriv module -----------------------------------------
      - module: unpriv
        branches: ['v20240411']
        chapters: {start: 5, end: 41}
        appendices: {start: 43, end: 46}

      - module: unpriv
        branches: ['v20250508']
        chapters: {start: 5, end: 41}
        appendices: {start: 42, end: 46}

      - module: unpriv
        branches: ['v20260120']
        chapters: {start: 5, end: 41}
        appendices: {start: 42, end: 49}

      - module: unpriv
        branches: ['main']
        chapters: {start: 3, end: 18}
        appendices: {start: 19, end: 20}

      # --- Profiles (rvprofile) ----------------------------------------------
      - component: rva20-rvi20-rva22
        module: ROOT
        branches: ['v1.0riscv-antora']
        chapters: {start: 4, end: 10}

      # --- Profiles (rva23) ----------------------------------------------
      - component: rva23
        module: ROOT
        branches: ['v1.0rva23-rvb23-antora']
        chapters: {start: 3, end: 6}

      # --- Profiles (rvb23) ----------------------------------------------
      - component: rvb23
        module: ROOT
        branches: ['v1.0rva23-rvb23-antora']
        chapters: {start: 3, end: 6}

      # --- AIA ---------------------------------------------------------------
      - component: aia
        module: ROOT
        branches: ['v20250312-antora']
        chapters: {start: 6, end: 13}

      # --- IOMMU -------------------------------------------------------------
      - component: iommu
        module: ROOT
        branches: ['v20260222-antora', 'v20250828-antora', 'v20250620-antora', 'v20240911-antora', 'v20230605-antora']
        chapters: {start: 6, end: 13}

      # --- Server SOC --------------------------------------------------------
      - component: server-soc
        module: ROOT
        branches: ['v1.0-antora']
        chapters: {start: 5, end: 6}

      # --- Efficient Trace ---------------------------------------------------
      - component: e-trace
        module: ROOT
        branches: ['v2.0-20250616-antora']
        chapters: {start: 5, end: 18}

      # --- Capacity & Bandwidth QoS ------------------------------------------
      - component: cbqri
        module: ROOT
        branches: ['v1.0-antora']
        chapters: {start: 5, end: 11}

      # --- RERI --------------------------------------------------------------
      - component: ras-eri
        module: ROOT
        branches: ['v1.0-antora']
        chapters: {start: 5, end: 7}

      # --- Debug -----------------------------------------------------
      - component: debug
        module: ROOT
        branches: ['v1.0-antora']
        chapters: {start: 3, end: 8}
        appendices: {start: 9, end: 9}

      # --- E-Trace Encap -----------------------------------------------------
      - component: trace-encap
        module: ROOT
        branches: ['v1.0-antora']
        chapters: {start: 5, end: 7}

      # --- Semihosting -------------------------------------------------------
      - component: semihosting
        module: ROOT
        branches: ['v1.0-antora']
        chapters: {start: 5, end: 6}

      # --- BRS ---------------------------------------------------------------
      - component: brs
        module: ROOT
        branches: ['v1.0-antora']
        chapters: {start: 5, end: 11}

      # --- FFH ---------------------------------------------------------------
      - component: acpi-ffh
        module: ROOT
        branches: ['v1.0.1-antora', 'v1.0.0-antora']
        chapters: {start: 6, end: 8}
        appendices: {start: 9, end: 10}


      # --- RIMT --------------------------------------------------------------
      - component: acpi-rimt
        module: ROOT
        branches: ['v1.0-antora']
        chapters: {start: 7, end: 9}

      # --- RPMI --------------------------------------------------------------
      - component: rpmi
        module: ROOT
        branches: ['v1.0-antora']
        chapters: {start: 7, end: 11}

      # --- RQSC --------------------------------------------------------------
      - component: rqsc
        module: ROOT
        branches: ['v1.0.0-antora']
        chapters: {start: 5, end: 7}

      # --- SBI 3.0 -----------------------------------------------------------
      - component: sbi
        module: ROOT
        branches: ['v3.0-antora']
        chapters: {start: 6, end: 27}

     # --- SBI 2.0 - ----------------------------------------------------------
      - component: sbi
        module: ROOT
        branches: ['v2.0-antora']
        chapters: {start: 6, end: 27}

    # --- SBI 1.0 - ----------------------------------------------------------
      - component: sbi
        module: ROOT
        branches: ['v1.0-antora']
        chapters: {start: 5, end: 27}

      # --- UEFI --------------------------------------------------------------
      - component: uefi
        module: ROOT
        branches: ['v1.0-antora']
        chapters: {start: 3, end: 5}

      # --- psABI -------------------------------------------------------------
      - component: abi
        module: ROOT
        branches: ['v1.0-antora']
        chapters:
          - {start: 8, end: 11}
          - {start: 14, end: 19}
          - {start: 23, end: 24}
        appendices: {start: 12, end: 12}

      # --- Intrinsics
      # Nav source has "* Appendix A/B/C/D:" as plain text (no xref) — the extension
      # detects these headers to track the current letter, then numbers the ** sub-entries
      # as A.1, A.2, etc. via appendix_subsections.
      # Line 8 (Examples) is Chapter 2; lines 6-7 are comments (no xref match).
      - component: vector-c-intrinsics
        module: ROOT
        branches: ['v1.0-antora']
        chapters: {start: 5, end: 8}
        appendix_subsections: {start: 11, end: 52}

      # --- PLIC --------------------------------------------------------------
      - component: plic
        module: ROOT
        branches: ['v1.0.0-antora']
        chapters: {start: 6, end: 14}

      # --- N-Trace -----------------------------------------------------------
      - component: nexus-trace
        module: ROOT
        branches: ['v1.0-antora']
        chapters: {start: 6, end: 18}

      # --- Connectors --------------------------------------------------------
      - component: trace-connectors
        module: ROOT
        branches: ['v1.0-antora']
        chapters: {start: 6, end: 10}

      # --- TCI ---------------------------------------------------------------
      - component: trace-control-interface
        module: ROOT
        branches: ['v1.0-antora']
        chapters: {start: 6, end: 16}

      # --- Server Platform ---------------------------------------------------
      - component: server-platform
        module: ROOT
        branches: ['v1.0-antora']
        chapters: {start: 5, end: 6}

      # docs-spec-template example spec — component: spec-sample | nav lines 7–8 (intro, chapter2)
      - component: spec-sample
        module: ROOT
        branches: ['antora-setup']
        chapters: {start: 7, end: 8}

      # --- Fallback: all other ROOT modules on v1.0-antora ---------------
      - module: ROOT
        branches: ['v1.0-antora']
        chapters: {start: 1, end: 100}

  # Add section numbering — reuses the anchor defined above
  - require: ./riscv-extensions/section_numbering_extension.js
    numbering_rules: *numbering_rules
  - require: ./riscv-extensions/page_title_fallback_extension.js
  # - require: "@cerbos/antora-llm-generator"
  #   skippaths:
  #     - "isa/v20240411/**"
  #     - "isa/v20250508/**"
  #     - "iommu/v20250828/**"
  #     - "iommu/v20250620/**"
  #     - "iommu/v20240911/**"
  #     - "iommu/v20230605/**"
  #     - "sbi/v2.0/**"
