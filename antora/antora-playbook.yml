  # Semihosting — component: semihost | chapters 5–6
  - url: https://github.com/riscv-non-isa/riscv-semihosting.git
    branches: v1.0-antora
    start_page: ROOT::index.adoc
    start_path: /

  # BRS — component: brs | chapters 5–11
  - url: https://github.com/riscv-non-isa/riscv-brs.git
    branches: v1.0-antora
    start_page: ROOT::index.adoc
    start_path: /

 # ACPI FFH — component: ffh | chapters
  - url: https://github.com/riscv-non-isa/riscv-acpi-ffh.git
    branches: [v1.0.1-antora, v1.0.0-antora]
