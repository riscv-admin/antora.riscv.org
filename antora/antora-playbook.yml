site:
  title: RISC-V Ratified Specifications Library
  #url: https://docs.riscv.org/reference/
  url: https://riscv-admin.github.io/antora-dev.riscv.org
  start_page: home::index.adoc
  keys:
    # Top link shown above the left TOC navigation tree
    # (configured in riscv-antora-only-ui-dev/src/partials/nav.hbs)
    toc_home_link_label: 'RISC-V Specifications'
    toc_home_link_path: 'home/index.html'
    # google_analytics: 'GTM-NXLCGZF4'


# Use explicit version folders for all versions.
# Short component-root redirects to the latest version are generated by the
# local latest_version_root_redirect_extension.js extension below.

output:
  dir: ./build/reference

# =============================================================================
# CONTENT SOURCES
# Each entry is annotated with its component ID and numbering rules for
# cross-reference with the nav_numbering and section_numbering extensions.
# =============================================================================
content:
  sources:

  # Home (no numbering rules)
  - url: ..
    branches: HEAD
    start_path: antora/site-home

  # Shared assets - component: common
  - url: ..
    branches: HEAD
    start_path: antora/common-assets

# ================= OVERVIEW LANDING PAGES (GITHUB) =================
  # Hardware Overview
  - url: ..
    branches: HEAD
    start_path: antora/overview/hardware
    start_page: ROOT::hardware.adoc
    nav:
      - modules/ROOT/nav.adoc

  # Profiles Overview
  - url: ..
    branches: HEAD
    start_path: antora/overview/profiles
    start_page: ROOT::profiles.adoc
    nav:
      - modules/ROOT/nav.adoc

  # Platform Software Overview
  - url: ..
    branches: HEAD
    start_path: antora/overview/platform-software
    start_page: ROOT::platform-software.adoc
    nav:
      - modules/ROOT/nav.adoc

  # Application Enablement Overview
  - url: ..
    branches: HEAD
    start_path: antora/overview/app-enablement
    start_page: ROOT::app-enablement.adoc
    nav:
      - modules/ROOT/nav.adoc

  # Debug, Trace, and RAS Overview
  - url: ..
    branches: HEAD
    start_path: antora/overview/trace-debug-ras
    start_page: ROOT::trace-debug-ras.adoc
    nav:
      - modules/ROOT/nav.adoc

  # Platforms Overview
  - url: ..
    branches: HEAD
    start_path: antora/overview/platforms
    start_page: ROOT::platforms.adoc
    nav:
      - modules/ROOT/nav.adoc

  # Under Development Overview
  - url: ..
    branches: HEAD
    start_path: antora/overview/under-dev
    start_page: ROOT::under-dev.adoc
    nav:
      - modules/ROOT/nav.adoc

  # ISA Manual — modules: priv, unpriv
  #   priv   v20240411:  chapters 5–25,  appendices 26–28
  #   priv   v20250508:  chapters 5–24,  appendices 25–27
  #   priv   v20260120:  chapters 5–24
  #   priv   main:       chapters 5–24,  appendices 25–27
  #   unpriv v20240411:  chapters 5–41,  appendices 43–46
  #   unpriv v20250508:  chapters 5–41,  appendices 42–46
  #   unpriv v20260120:  chapters 5–39,  appendices 40–44
  #   unpriv main:       chapters 3–18,  appendices 19–20
  - url: https://github.com/riscv/riscv-isa-manual.git
    #branches: [main, v20250508, v20240411]
    branches: [v20260120, v20250508, v20240411]
    start_page: ROOT::index.adoc
    start_path: /
    worktrees: true   # Enable symlink resolution
    submodules: true
    asciidoc:
      attributes:
        page-group: isa

 # Profiles - component: rvprofile |
  - url: https://github.com/riscv/riscv-profiles.git
    branches: v1.0riscv-antora
    worktrees: true

 # Profiles - component: rva23
  - url: https://github.com/riscv/riscv-profiles.git
    branches: v1.0rva23-rvb23-antora
    start_path: modules/rva23
    worktrees: true

 # Profiles - component: rvb23
  - url: https://github.com/riscv/riscv-profiles.git
    branches: v1.0rva23-rvb23-antora
    start_path: modules/rvb23
    worktrees: true

  # AIA — component: aia | chapters 6–13
  - url: https://github.com/riscv/riscv-aia.git
    branches: v20250312-antora
    start_page: ROOT::index.adoc
    start_path: /
    worktrees: true
    submodules: true

  # IOMMU — component: iommu | chapters 6–14
  - url: https://github.com/riscv-non-isa/riscv-iommu.git
    branches: [v20260222-antora, 20250828-antora, 20250620-antora, 20240911-antora, 20230605-antora]
    start_page: ROOT::index.adoc
    start_path: /
    worktrees: true
    submodules: true

  # PLIC — component: plic | chapters 6–13
  - url: https://github.com/riscv/riscv-plic-spec.git
    branches: v1.0.0-antora
    start_page: ROOT::index.adoc
    start_path: /

  # Server SOC — component: soc | chapters 5–6
  - url: https://github.com/riscv-non-isa/server-soc.git
    branches: v1.0-antora
    start_page: ROOT::index.adoc
    start_path: /

  # Efficient Trace — component: techtrace | chapters 5–18
  - url: https://github.com/riscv-non-isa/riscv-trace-spec.git
    branches: v2.0-20250616-antora
    start_page: ROOT::index.adoc
    start_path: /

  # Capacity & Bandwidth QoS — component: qos | chapters 5–11
  - url: https://github.com/riscv-non-isa/riscv-cbqri.git
    branches: v1.0-antora
    start_page: ROOT::index.adoc
