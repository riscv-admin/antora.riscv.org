name: Deploy Portal
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
permissions:
  contents: write
jobs:
  deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
    - uses: actions/checkout@v4
    - name: Cache Kroki diagrams
      uses: actions/cache@v4
      with:
        path: antora/.cache/kroki
        key: kroki-cache-${{ hashFiles('antora/**/*.adoc') }}
        restore-keys: |
          kroki-cache-
    - name: Install Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4.1'
        bundler-cache: true
    - name: Install Antora Dependencies
      run: |
        cd antora
        gem install bundler
        bundle install
        npm install
    - name: Start Kroki
      run: docker compose -f antora/docker-compose.yml up -d
    - name: Wait for Kroki to be ready
      run: |
        echo "Waiting for Kroki to start..."
        timeout 60 bash -c 'until curl -sf http://localhost:9870/health > /dev/null; do sleep 2; done'
        echo "Kroki is ready!"
    - name: Install dependencies
      run: |
        npm install -g @antora/cli@3.1 @antora/site-generator@3.1
        npm install -g asciidoctor-kroki
    - name: Build Antora
      continue-on-error: true
      run: |
        cd antora
        npx antora --cache-dir .cache/antora antora-playbook.yml --stacktrace

    - name: Check build output exists
      run: |
        if [ ! -d "antora/build" ]; then
          echo "Build directory does not exist - build failed"
          exit 1
        fi
        echo "Build directory exists, proceeding with deploy"
        ls antora/build/ | head -20

    - name: Stop Kroki
      if: always()
      run: docker compose -f antora/docker-compose.yml down
    - name: Copy root redirect index
      run: cp antora/site-root/index.html antora/build/index.html

    - name: Copy CNAME to site root
      run: cp antora/site-root/CNAME antora/build/CNAME
    - name: Copy robots.txt to site root
      run: cp antora/build/reference/robots.txt antora/build/robots.txt || true

    - name: Copy llms.txt and llms-full.txt to site root
      run: |
        cp antora/build/reference/llms.txt antora/build/llms.txt || true
        cp antora/build/reference/llms-full.txt antora/build/llms-full.txt || true

    - name: Manually Migrate Standalone PDFs
      continue-on-error: true
      run: |
        cd antora
        cp -a ./pdfs/. ./build/reference/
    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: antora/build
    - name: Upload Artifact Logs
      uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: Portal Snapshot
        path: ./antora/build/
